<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="userSpaceOnUse" x1="400" y1="150" x2="800" y2="450">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>
  <!-- Glow blob -->
  <ellipse cx="600" cy="300" rx="350" ry="200" fill="url(#glow)"/>
  <!-- Decorative circles -->
  <circle cx="120" cy="120" r="60" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <circle cx="120" cy="120" r="40" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <circle cx="1080" cy="480" r="80" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  <circle cx="1080" cy="480" r="50" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
  <!-- Document icon -->
  <g transform="translate(480, 160)">
    <rect x="0" y="0" width="240" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="30" width="200" height="12" rx="6" fill="#6366f1" opacity="0.8"/>
    <rect x="20" y="58" width="160" height="8" rx="4" fill="#475569"/>
    <rect x="20" y="76" width="180" height="8" rx="4" fill="#475569"/>
    <rect x="20" y="94" width="140" height="8" rx="4" fill="#475569"/>
    <rect x="20" y="120" width="200" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="138" width="170" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="156" width="190" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="174" width="130" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="200" width="200" height="8" rx="4" fill="#1e3a5f"/>
    <rect x="20" y="218" width="150" height="8" rx="4" fill="#1e3a5f"/>
    <rect x="20" y="236" width="175" height="8" rx="4" fill="#1e3a5f"/>
    <!-- Code snippet decoration -->
    <rect x="20" y="262" width="80" height="24" rx="4" fill="#6366f1" opacity="0.2"/>
    <text x="30" y="278" font-family="monospace" font-size="10" fill="#818cf8">Read more →</text>
  </g>
  <!-- Floating dots -->
  <circle cx="350" cy="200" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="380" cy="350" r="3" fill="#06b6d4" opacity="0.5"/>
  <circle cx="870" cy="180" r="4" fill="#f472b6" opacity="0.5"/>
  <circle cx="840" cy="400" r="3" fill="#6366f1" opacity="0.4"/>
  <!-- Bottom label -->
  <rect x="0" y="550" width="1200" height="50" fill="#0f172a" opacity="0.8"/>
  <rect x="0" y="548" width="1200" height="3" fill="url(#accent)"/>
  <text x="600" y="580" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle" letter-spacing="3">TECHICIOUS · RESOURCE HUB</text>
</svg>
