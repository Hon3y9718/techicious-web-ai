<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#1e40af" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="60" y1="0" x2="60" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="180" y1="0" x2="180" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="420" y1="0" x2="420" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="540" y1="0" x2="540" y2="400"/>
  </g>
  <!-- Terminal window -->
  <rect x="60" y="60" width="340" height="220" rx="8" fill="#0d1117" opacity="0.9"/>
  <rect x="60" y="60" width="340" height="28" rx="8" fill="#161b22"/>
  <rect x="60" y="76" width="340" height="12" fill="#161b22"/>
  <!-- Terminal dots -->
  <circle cx="80" cy="74" r="5" fill="#ff5f57"/>
  <circle cx="96" cy="74" r="5" fill="#ffbd2e"/>
  <circle cx="112" cy="74" r="5" fill="#28c840"/>
  <!-- Terminal text -->
  <text x="76" y="110" font-family="monospace" font-size="11" fill="#38bdf8">$ format --input app.js</text>
  <text x="76" y="128" font-family="monospace" font-size="11" fill="#4ade80">✓ Formatted 247 lines</text>
  <text x="76" y="148" font-family="monospace" font-size="11" fill="#38bdf8">$ validate --json data.json</text>
  <text x="76" y="166" font-family="monospace" font-size="11" fill="#4ade80">✓ Valid JSON structure</text>
  <text x="76" y="186" font-family="monospace" font-size="11" fill="#38bdf8">$ jwt decode token.txt</text>
  <text x="76" y="204" font-family="monospace" font-size="11" fill="#a78bfa">{ "sub": "user_123",</text>
  <text x="76" y="220" font-family="monospace" font-size="11" fill="#a78bfa">  "exp": 1735689600 }</text>
  <text x="76" y="250" font-family="monospace" font-size="11" fill="#64748b">$ <text fill="#e2e8f0" id="cursor">_</text></text>
  <!-- Side tools panel -->
  <rect x="420" y="60" width="130" height="220" rx="8" fill="#0d1117" opacity="0.9"/>
  <text x="435" y="90" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="bold">TOOLS</text>
  <rect x="430" y="98" width="110" height="28" rx="4" fill="#1e3a5f"/>
  <text x="445" y="117" font-family="sans-serif" font-size="10" fill="#38bdf8">⚙ Formatter</text>
  <rect x="430" y="133" width="110" height="28" rx="4" fill="#1a1f2e"/>
  <text x="445" y="152" font-family="sans-serif" font-size="10" fill="#94a3b8">{ } Validator</text>
  <rect x="430" y="168" width="110" height="28" rx="4" fill="#1a1f2e"/>
  <text x="445" y="187" font-family="sans-serif" font-size="10" fill="#94a3b8">🔑 JWT Debug</text>
  <rect x="430" y="203" width="110" height="28" rx="4" fill="#1a1f2e"/>
  <text x="445" y="222" font-family="sans-serif" font-size="10" fill="#94a3b8">⚡ Minifier</text>
  <rect x="430" y="238" width="110" height="28" rx="4" fill="#1a1f2e"/>
  <text x="445" y="257" font-family="sans-serif" font-size="10" fill="#94a3b8">🔐 Encoder</text>
  <!-- Title -->
  <text x="300" y="330" font-family="sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Dev Utility Kit</text>
  <text x="300" y="355" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Essential tools for modern developers</text>
  <!-- Accent line -->
  <rect x="200" y="368" width="200" height="3" rx="2" fill="url(#accent)"/>
</svg>
