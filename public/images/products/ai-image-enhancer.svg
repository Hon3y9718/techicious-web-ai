<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a1e"/>
      <stop offset="100%" style="stop-color:#1a0533"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0c0a1e;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg2)"/>
  <!-- Glow effect -->
  <ellipse cx="300" cy="200" rx="200" ry="150" fill="url(#centerGlow)"/>
  <!-- Before image (low res) -->
  <rect x="50" y="80" width="200" height="150" rx="6" fill="#1a1a2e" stroke="#374151" stroke-width="1"/>
  <text x="150" y="100" font-family="sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ORIGINAL</text>
  <!-- Pixelated appearance -->
  <rect x="55" y="108" width="20" height="20" fill="#2d3748"/>
  <rect x="75" y="108" width="20" height="20" fill="#374151"/>
  <rect x="95" y="108" width="20" height="20" fill="#4b5563"/>
  <rect x="115" y="108" width="20" height="20" fill="#374151"/>
  <rect x="135" y="108" width="20" height="20" fill="#4b5563"/>
  <rect x="155" y="108" width="20" height="20" fill="#2d3748"/>
  <rect x="175" y="108" width="20" height="20" fill="#374151"/>
  <rect x="195" y="108" width="20" height="20" fill="#2d3748"/>
  <rect x="215" y="108" width="25" height="20" fill="#374151"/>
  <rect x="55" y="128" width="20" height="20" fill="#4b5563"/>
  <rect x="75" y="128" width="20" height="20" fill="#6b7280"/>
  <rect x="95" y="128" width="20" height="20" fill="#4b5563"/>
  <rect x="115" y="128" width="20" height="20" fill="#6b7280"/>
  <rect x="135" y="128" width="20" height="20" fill="#4b5563"/>
  <rect x="155" y="128" width="20" height="20" fill="#374151"/>
  <rect x="175" y="128" width="20" height="20" fill="#4b5563"/>
  <rect x="195" y="128" width="20" height="20" fill="#6b7280"/>
  <rect x="215" y="128" width="25" height="20" fill="#4b5563"/>
  <rect x="55" y="148" width="190" height="15" fill="#2d3748"/>
  <rect x="55" y="163" width="190" height="15" fill="#374151"/>
  <rect x="55" y="178" width="190" height="15" fill="#2d3748"/>
  <rect x="55" y="193" width="190" height="15" fill="#374151"/>
  <rect x="55" y="208" width="190" height="15" fill="#2d3748"/>
  <!-- AI Processing arrow -->
  <g transform="translate(270, 155)">
    <circle cx="30" cy="30" r="28" fill="#1e0b3a" stroke="#7c3aed" stroke-width="2"/>
    <text x="30" y="24" font-family="sans-serif" font-size="9" fill="#c084fc" text-anchor="middle" font-weight="bold">AI</text>
    <path d="M10 36 L50 36" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="48,32 56,36 48,40" fill="#c084fc"/>
    <circle cx="20" cy="44" r="2" fill="#f472b6" opacity="0.8"/>
    <circle cx="30" cy="48" r="2" fill="#c084fc" opacity="0.8"/>
    <circle cx="40" cy="44" r="2" fill="#818cf8" opacity="0.8"/>
  </g>
  <!-- After image (high res) -->
  <rect x="350" y="80" width="200" height="150" rx="6" fill="#0f0a2a" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="100" font-family="sans-serif" font-size="9" fill="#c084fc" text-anchor="middle" font-weight="bold">ENHANCED 4×</text>
  <!-- Smooth gradient representing enhanced image -->
  <defs>
    <linearGradient id="smooth1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="smooth2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
  </defs>
  <rect x="355" y="108" width="190" height="40" rx="2" fill="url(#smooth1)"/>
  <rect x="355" y="148" width="190" height="40" rx="2" fill="url(#smooth2)"/>
  <rect x="355" y="188" width="190" height="37" rx="2" fill="url(#smooth1)"/>
  <!-- Stars/sparkles on enhanced image -->
  <circle cx="380" cy="120" r="2" fill="#f472b6" filter="url(#blur)"/>
  <circle cx="500" cy="135" r="3" fill="#c084fc" filter="url(#blur)"/>
  <circle cx="430" cy="165" r="2" fill="#818cf8" filter="url(#blur)"/>
  <circle cx="470" cy="200" r="2" fill="#f472b6" filter="url(#blur)"/>
  <!-- Quality badge -->
  <rect x="390" y="105" width="120" height="16" rx="8" fill="#7c3aed" opacity="0.7"/>
  <text x="450" y="117" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">Crystal Clear Quality</text>
  <!-- Stats bar at bottom -->
  <rect x="50" y="255" width="500" height="60" rx="8" fill="#0d0b1e" opacity="0.8"/>
  <text x="130" y="275" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Resolution</text>
  <text x="130" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">4× Upscale</text>
  <text x="300" y="275" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Noise Reduction</text>
  <text x="300" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f472b6" text-anchor="middle">AI-Powered</text>
  <text x="470" y="275" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Processing</text>
  <text x="470" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#818cf8" text-anchor="middle">&lt; 3 Seconds</text>
  <!-- Title -->
  <text x="300" y="338" font-family="sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">AI Image Enhancer</text>
  <text x="300" y="360" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Upscale and sharpen with artificial intelligence</text>
  <!-- Accent line -->
  <rect x="180" y="373" width="240" height="3" rx="2" fill="url(#glow)"/>
</svg>
