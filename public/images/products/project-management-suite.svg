<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg3)"/>
  <!-- Kanban board -->
  <rect x="30" y="50" width="540" height="250" rx="10" fill="#0d1b2a" opacity="0.9"/>
  <!-- Board header -->
  <rect x="30" y="50" width="540" height="35" rx="10" fill="#111e2e"/>
  <rect x="30" y="70" width="540" height="15" fill="#111e2e"/>
  <circle cx="52" cy="67" r="6" fill="#ef4444"/>
  <circle cx="68" cy="67" r="6" fill="#fbbf24"/>
  <circle cx="84" cy="67" r="6" fill="#22c55e"/>
  <text x="300" y="72" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="bold">Sprint Board — Q3 2025</text>
  <!-- Column: To Do -->
  <rect x="45" y="93" width="155" height="195" rx="6" fill="#0a1628"/>
  <text x="122" y="112" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="bold">TO DO</text>
  <rect x="52" y="118" width="141" height="50" rx="4" fill="#1e2d3d"/>
  <text x="64" y="132" font-family="sans-serif" font-size="8" fill="#e2e8f0">Design homepage mockup</text>
  <rect x="57" y="140" width="40" height="12" rx="6" fill="#3b82f6" opacity="0.7"/>
  <text x="77" y="150" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Design</text>
  <rect x="52" y="174" width="141" height="50" rx="4" fill="#1e2d3d"/>
  <text x="64" y="188" font-family="sans-serif" font-size="8" fill="#e2e8f0">Set up CI/CD pipeline</text>
  <rect x="57" y="196" width="32" height="12" rx="6" fill="#8b5cf6" opacity="0.7"/>
  <text x="73" y="206" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">DevOps</text>
  <!-- Column: In Progress -->
  <rect x="215" y="93" width="155" height="195" rx="6" fill="#0a1628"/>
  <text x="292" y="112" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle" font-weight="bold">IN PROGRESS</text>
  <rect x="222" y="118" width="141" height="50" rx="4" fill="#1e2d3d" stroke="#10b981" stroke-width="1"/>
  <text x="234" y="132" font-family="sans-serif" font-size="8" fill="#e2e8f0">API integration layer</text>
  <rect x="227" y="140" width="32" height="12" rx="6" fill="#f59e0b" opacity="0.7"/>
  <text x="243" y="150" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Backend</text>
  <circle cx="350" cy="146" r="8" fill="#0ea5e9"/>
  <text x="350" y="150" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">AJ</text>
  <rect x="222" y="174" width="141" height="50" rx="4" fill="#1e2d3d" stroke="#10b981" stroke-width="1"/>
  <text x="234" y="188" font-family="sans-serif" font-size="8" fill="#e2e8f0">User auth flow</text>
  <rect x="227" y="196" width="40" height="12" rx="6" fill="#10b981" opacity="0.7"/>
  <text x="247" y="206" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Frontend</text>
  <!-- Column: Done -->
  <rect x="385" y="93" width="155" height="195" rx="6" fill="#0a1628"/>
  <text x="462" y="112" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="bold">DONE</text>
  <rect x="392" y="118" width="141" height="50" rx="4" fill="#1a2a1a"/>
  <text x="404" y="132" font-family="sans-serif" font-size="8" fill="#6b7280" text-decoration="line-through">Database schema</text>
  <text x="520" y="132" font-family="sans-serif" font-size="10" fill="#22c55e">✓</text>
  <rect x="392" y="174" width="141" height="50" rx="4" fill="#1a2a1a"/>
  <text x="404" y="188" font-family="sans-serif" font-size="8" fill="#6b7280" text-decoration="line-through">Project scaffolding</text>
  <text x="520" y="188" font-family="sans-serif" font-size="10" fill="#22c55e">✓</text>
  <!-- Progress bar -->
  <rect x="30" y="315" width="540" height="20" rx="4" fill="#0a1628"/>
  <rect x="30" y="315" width="378" height="20" rx="4" fill="url(#accent3)" opacity="0.8"/>
  <text x="300" y="329" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Sprint Progress: 70%</text>
  <!-- Team avatars -->
  <circle cx="60" cy="352" r="14" fill="#0ea5e9"/>
  <text x="60" y="357" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">AJ</text>
  <circle cx="88" cy="352" r="14" fill="#8b5cf6"/>
  <text x="88" y="357" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">BS</text>
  <circle cx="116" cy="352" r="14" fill="#f59e0b"/>
  <text x="116" y="357" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">CL</text>
  <text x="140" y="357" font-family="sans-serif" font-size="10" fill="#64748b">+4 members</text>
  <!-- Title -->
  <text x="400" y="348" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Project Suite</text>
  <text x="400" y="368" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Agile-ready team collaboration</text>
  <!-- Accent line -->
  <rect x="180" y="381" width="240" height="3" rx="2" fill="url(#accent3)"/>
</svg>
